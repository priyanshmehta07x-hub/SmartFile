services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: smartfile
      MYSQL_USER: smartfile
      MYSQL_PASSWORD: smartfile_local
      MYSQL_ROOT_PASSWORD: local_root_change_me
    ports:
      - "3306:3306"
    volumes:
      - smartfile_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "smartfile", "-psmartfile_local"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  smartfile_mysql:
